<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>DR Musik Samling</title>
  </head>
  <body>
    <div id="app">
      <h1>DR Musik Samling</h1>
      <table id="music_record_table" class="table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Artist</th>
            <th>Duration</th>
            <th>Year</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="musicRecord in musicRecords" :key="musicRecord.id">
            <td>{{ musicRecord.title }}</td>
            <td>{{ musicRecord.artist }}</td>
            <td>{{ musicRecord.duration }}</td>
            <td>{{ musicRecord.year }}</td>
          </tr>
        </tbody>
      </table>
      <h2>Add New Music Record</h2>
      <form @submit.prevent="AddAsync">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" v-model="addData.title" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="artist" class="form-label">Artist</label>
          <input type="text" id="artist" v-model="addData.artist" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="duration" class="form-label">Duration</label>
          <input type="text" id="duration" v-model="addData.duration" class="form-control">
        </div>
        <div class="mb-3">
          <label for="year" class="form-label">Year</label>
          <input type="number" id="year" v-model.number="addData.year" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Add Record</button>
      </form>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
